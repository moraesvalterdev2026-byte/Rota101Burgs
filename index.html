<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota 101 Smash Burguer & Xis | Cardápio Digital</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#FF5722',
                            yellow: '#FFB300',
                            dark: '#121212',
                            card: '#1E1E1E',
                            border: '#2A2A2A'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-brand-dark text-gray-100 font-sans antialiased selection:bg-brand-orange selection:text-white pb-24">

    <!-- HEADER FIXO -->
    <header class="fixed top-0 left-0 right-0 bg-brand-dark/95 backdrop-blur-md border-b border-brand-border z-40 px-4 py-3 shadow-lg">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-brand-orange text-white flex items-center justify-center font-black text-xl shadow-md">
                    101
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight text-white">ROTA 101</h1>
                    <div class="flex items-center space-x-2 text-xs">
                        <!-- Badge renderizado dinamicamente via JS -->
                        <span id="store-status-badge"></span>
                        <span class="text-gray-400">Cidade Alta</span>
                    </div>
                </div>
            </div>

            <!-- Botão Carrinho Fixo Header -->
            <button id="cart-header-btn" onclick="cart.toggleDrawer()" class="relative p-2.5 rounded-xl bg-brand-card hover:bg-brand-border border border-brand-border transition-all">
                <i class="fa-solid fa-cart-shopping text-brand-yellow text-lg"></i>
                <span id="cart-badge" class="absolute -top-1.5 -right-1.5 bg-brand-orange text-white text-[10px] font-extrabold w-5 h-5 rounded-full flex items-center justify-center border-2 border-brand-dark hidden">
                    0
                </span>
            </button>
        </div>
    </header>

    <main class="max-w-xl mx-auto pt-20 px-4">
        
        <!-- NAVEGAÇÃO DE CATEGORIAS (Pills Roláveis) -->
        <nav class="sticky top-[61px] bg-brand-dark z-30 pt-2 pb-3 -mx-4 px-4 overflow-x-auto no-scrollbar border-b border-brand-border/50">
            <div id="categories-container" class="flex space-x-2 whitespace-nowrap">
                <!-- Categorias injetadas via JavaScript -->
            </div>
        </nav>

        <!-- LISTA DE PRODUTOS -->
        <section class="mt-4 space-y-8" id="menu-sections">
            <!-- As seções e produtos serão injetados via JavaScript -->
        </section>
    </main>

    <!-- BARRA FLUTUANTE INFERIOR DO CARRINHO (Mobile CTA) -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-brand-card border-t border-brand-border p-4 z-40 transform translate-y-full transition-transform duration-300 shadow-2xl">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <div>
                <span class="text-xs text-gray-400 block">Total sem taxa</span>
                <span id="cart-bar-total" class="text-lg font-bold text-brand-yellow">R$ 0,00</span>
            </div>
            <button onclick="cart.toggleDrawer()" class="bg-gradient-to-r from-brand-orange to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white font-bold py-2.5 px-6 rounded-xl flex items-center space-x-2 shadow-lg shadow-brand-orange/20 transition-all">
                <span>Ver Carrinho</span>
                <span id="cart-bar-count" class="bg-white/20 text-xs px-2 py-0.5 rounded-full">0</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </div>
    </div>

    <!-- MODAL DE PERSONALIZAÇÃO DE PRODUTO -->
    <div id="product-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-brand-card w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90vh] flex flex-col overflow-hidden border border-brand-border shadow-2xl">
            <!-- Header Modal -->
            <div class="relative h-48 bg-gray-800">
                <img id="modal-img" src="" alt="" class="w-full h-full object-cover">
                <button onclick="app.closeModal()" class="absolute top-3 right-3 bg-black/60 text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-black transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="p-4 overflow-y-auto space-y-4 flex-1">
                <div>
                    <h2 id="modal-title" class="text-xl font-bold text-white"></h2>
                    <p id="modal-desc" class="text-sm text-gray-400 mt-1"></p>
                    <span id="modal-price" class="inline-block mt-2 font-extrabold text-brand-yellow text-lg"></span>
                </div>

                <hr class="border-brand-border">

                <!-- Adicionais -->
                <div id="modal-extras-container" class="space-y-3">
                    <h3 class="font-bold text-sm text-gray-200 uppercase tracking-wider">Adicionais Extras</h3>
                    <div id="modal-extras-list" class="space-y-2">
                        <!-- Lista dinâmica de extras -->
                    </div>
                </div>

                <!-- Observação do Item -->
                <div class="space-y-2">
                    <label class="font-bold text-sm text-gray-200 block">Observação do Item</label>
                    <textarea id="modal-obs" rows="2" placeholder="Ex: Sem cebola, pão bem selado..." class="w-full bg-brand-dark border border-brand-border rounded-xl p-3 text-sm text-white focus:border-brand-orange focus:outline-none transition-colors placeholder:text-gray-600"></textarea>
                </div>
            </div>

            <!-- Footer Modal -->
            <div class="p-4 border-t border-brand-border bg-brand-dark/50 flex items-center justify-between gap-4">
                <div class="flex items-center border border-brand-border rounded-xl bg-brand-dark">
                    <button onclick="app.decrementQty()" class="w-10 h-10 text-brand-orange font-bold text-lg hover:bg-brand-border/50 rounded-l-xl transition-colors">-</button>
                    <span id="modal-qty" class="w-8 text-center font-bold text-white">1</span>
                    <button onclick="app.incrementQty()" class="w-10 h-10 text-brand-orange font-bold text-lg hover:bg-brand-border/50 rounded-r-xl transition-colors">+</button>
                </div>
                <button id="modal-add-btn" class="flex-1 bg-brand-orange hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-between shadow-lg transition-colors">
                    <span>Adicionar</span>
                    <span id="modal-total-btn">R$ 0,00</span>
                </button>
            </div>
        </div>
    </div>

    <!-- DRAWER LATERAL DO CARRINHO (CHECKOUT) -->
    <div id="cart-drawer" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex justify-end hidden opacity-0 transition-opacity duration-300">
        <div class="bg-brand-card w-full max-w-md h-full flex flex-col border-l border-brand-border shadow-2xl">
            <!-- Header Drawer -->
            <div class="p-4 border-b border-brand-border flex items-center justify-between bg-brand-dark">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-bag-shopping text-brand-orange"></i>
                    <h2 class="font-bold text-lg text-white">Seu Pedido</h2>
                </div>
                <button onclick="cart.toggleDrawer()" class="text-gray-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Itens do Carrinho -->
            <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4 divide-y divide-brand-border/50">
                <!-- Itens serão renderizados dinamicamente -->
            </div>

            <!-- Formulário de Checkout -->
            <div class="p-4 border-t border-brand-border bg-brand-dark/80 space-y-4 overflow-y-auto max-h-[50vh]">
                <div class="space-y-3">
                    <h3 class="font-bold text-xs uppercase tracking-wider text-brand-yellow">1. Dados do Cliente</h3>
                    <input type="text" id="client-name" placeholder="Seu Nome *" class="w-full bg-brand-dark border border-brand-border rounded-xl p-3 text-sm text-white focus:border-brand-orange focus:outline-none">
                </div>

                <div class="space-y-3">
                    <h3 class="font-bold text-xs uppercase tracking-wider text-brand-yellow">2. Entrega ou Retirada</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center justify-center p-3 border border-brand-border rounded-xl bg-brand-dark cursor-pointer has-[:checked]:border-brand-orange has-[:checked]:text-brand-orange text-xs font-bold text-gray-300">
                            <input type="radio" name="delivery-type" value="delivery" checked onchange="cart.toggleDeliveryFields()" class="hidden">
                            <i class="fa-solid fa-motorcycle mr-2"></i> Tele-Entrega
                        </label>
                        <label class="flex items-center justify-center p-3 border border-brand-border rounded-xl bg-brand-dark cursor-pointer has-[:checked]:border-brand-orange has-[:checked]:text-brand-orange text-xs font-bold text-gray-300">
                            <input type="radio" name="delivery-type" value="pickup" onchange="cart.toggleDeliveryFields()" class="hidden">
                            <i class="fa-solid fa-store mr-2"></i> Retirada (Cidade Alta)
                        </label>
                    </div>

                    <!-- Injetado dinamicamente via JS (select de bairros + input endereço) -->
                    <div id="delivery-fields" class="space-y-2"></div>
                </div>

                <div class="space-y-3">
                    <h3 class="font-bold text-xs uppercase tracking-wider text-brand-yellow">3. Forma de Pagamento</h3>
                    <select id="payment-method" onchange="cart.toggleChangeField()" class="w-full bg-brand-dark border border-brand-border rounded-xl p-3 text-sm text-white focus:border-brand-orange focus:outline-none">
                        <option value="Pix Online">Pix Online</option>
                        <option value="Cartão (Crédito/Débito no Motoboy)">Cartão na Entrega</option>
                        <option value="Dinheiro">Dinheiro</option>
                    </select>
                    <div id="change-field" class="hidden">
                        <input type="text" id="cash-change" placeholder="Troco para quanto? (ex: R$ 50,00)" class="w-full bg-brand-dark border border-brand-border rounded-xl p-3 text-sm text-white focus:border-brand-orange focus:outline-none">
                    </div>
                </div>

                <div class="space-y-2">
                    <h3 class="font-bold text-xs uppercase tracking-wider text-brand-yellow">4. Observações Geral</h3>
                    <input type="text" id="order-obs" placeholder="Ex: Entregar pelo portão lateral" class="w-full bg-brand-dark border border-brand-border rounded-xl p-3 text-sm text-white focus:border-brand-orange focus:outline-none">
                </div>

                <!-- Resumo Financeiro -->
                <div class="pt-2 border-t border-brand-border/50 space-y-1 text-sm">
                    <div class="flex justify-between text-gray-400">
                        <span>Subtotal</span>
                        <span id="drawer-subtotal">R$ 0,00</span>
                    </div>

                    <!-- Linha dinâmica da Taxa de Entrega -->
                    <div id="drawer-delivery-fee-row" class="hidden"></div>

                    <div class="flex justify-between font-bold text-lg text-white pt-1">
                        <span>Total</span>
                        <span id="drawer-total" class="text-brand-yellow">R$ 0,00</span>
                    </div>
                </div>

                <button onclick="cart.checkout()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3.5 px-4 rounded-xl flex items-center justify-center space-x-2 shadow-lg shadow-emerald-900/30 transition-all text-base">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                    <span>Concluir Pedido no WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
